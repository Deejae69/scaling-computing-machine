# MetaTrader 5 Trading Bot Configuration

# Trading Parameters
trading:
  symbol: "EURUSD"
  timeframe: "M5"  # Supported: M1, M5, M15, M30, H1, H4, D1
  max_spread_points: 15  # Maximum allowed spread in points
  
# Risk Management
risk:
  equity_risk_percent: 1.0  # Risk 1% of equity per trade
  daily_loss_cap_percent: 2.5  # Stop trading after -2.5% daily loss
  max_consecutive_losses: 3  # Kill switch after N consecutive losses
  atr_stop_multiplier: 1.8  # Stop loss = ATR * multiplier
  risk_reward_ratio: 1.7  # Take profit = stop loss * ratio
  enable_trailing_stop: true  # Enable trailing stop after 1R profit

# Strategy - EMA Crossover with RSI and ATR Filter
strategy:
  ema_fast_period: 20
  ema_slow_period: 50
  rsi_period: 14
  rsi_min: 40
  rsi_max: 60
  atr_period: 14
  atr_volatility_threshold: 0.8  # ATR must be > rolling mean * threshold

# Execution
execution:
  slippage_points: 10  # Maximum acceptable slippage
  order_type: "MARKET"  # MARKET or LIMIT
  magic_number: 12345  # Unique identifier for bot orders
  connection_retries: 3  # Number of connection retry attempts
  heartbeat_interval: 10  # Log heartbeat every N iterations
  
# Data Collection
data:
  lookback_bars: 500  # Number of historical bars to fetch
  
# Modes
mode:
  backtest: false  # Run in backtest mode
  paper_trade: true  # Run in paper/demo mode (requires MT5 demo account)
  live_trade: false  # Run in live mode (use with caution)
  
# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "bot.log"
  console: true
